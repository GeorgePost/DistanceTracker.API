# Local development stack. Use an explicit production configuration for hosting.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: ${DB_CONNECTION_STRING:?Set DB_CONNECTION_STRING using Host=postgres for this stack}
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-redis:6379}
      ExternalApis__OpenRouteService__ApiKey: ${ORS_KEY:?Set ORS_KEY}
      ExternalApis__Nominatim__UserAgent: ${NOMINATIM_USER:?Set NOMINATIM_USER}
      Stripe__Enabled: ${STRIPE_ENABLED:-true}
      Stripe__AllowPastDueAccess: ${STRIPE_ALLOW_PAST_DUE_ACCESS:-true}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:?Set STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET}
      Stripe__PriceId: ${STRIPE_PRICE_ID:?Set STRIPE_PRICE_ID}
      Resend__ApiKey: ${RESEND_APIKEY:?Set RESEND_APIKEY}
      Resend__SenderEmail: ${RESEND_SENDER_EMAIL:?Set RESEND_SENDER_EMAIL}
      Resend__FromName: ${RESEND_FROM_NAME:-Distance Tracker}
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://localhost:3000}
      Jwt__SigningKey: ${JWT_SECRET:?Set JWT_SECRET}
      DataProtection__KeyPath: /var/lib/distancetracker/keys
    volumes:
      - api_keys:/var/lib/distancetracker/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    # Accessed by the API over the Compose network at postgres:5432.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
  redis_data:
  api_keys:
